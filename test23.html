<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: #333; height: 100vh; }
    
    .screen {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 2rem; box-sizing: border-box; overflow: hidden;
      border: 2px solid yellow;
    }
    
    .wrapper { 
      position: relative; 
      display: flex; /* flex makes it shrink wrap */
      max-width: 100%; max-height: 100%; 
      border: 4px solid blue;
      background: rgba(0,0,255,0.2);
      min-width: 0; min-height: 0;
    }
    
    img { 
      display: block; 
      max-width: 100%; max-height: 100%; 
      width: auto; height: auto; 
      border: 2px solid red;
      min-width: 0; min-height: 0;
    }
    
  </style>
</head>
<body>
  <div class="screen">
    <div class="wrapper" id="wrapper">
      <img id="img" src="https://fastly.picsum.photos/id/111/400/2000.jpg?hmac=X-oR08B0D7D06vM84f18n598R58Y5C4aB97w53z03W0" />
    </div>
  </div>
  <script>
    setTimeout(() => {
      const wrapper = document.getElementById('wrapper');
      const img = document.getElementById('img');
      console.log('wrapper:', wrapper.getBoundingClientRect());
      console.log('img:', img.getBoundingClientRect());
    }, 500);
  </script>
</body>
</html>
