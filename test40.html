<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: #333; height: 100vh; display: flex; flex-direction: column; }
    
    .outer {
      display: flex; flex-direction: row; height: calc(100vh - 100px);
    }
    
    .main {
      flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; min-height: 0;
      background: #000;
    }
    
    .bg111 {
      flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; min-height: 0; background: #111; position: relative;
    }
    
    .centerer {
      flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; width: 100%; height: 100%;
      padding: 2rem; box-sizing: border-box;
      border: 1px solid red;
    }
    
    .wrapper { 
      position: relative; display: flex; min-width: 0; min-height: 0; max-width: 100%; max-height: 100%;
      border: 2px solid yellow;
    }
    
    img { 
      display: block; min-width: 0; min-height: 0; max-width: 100%; max-height: 100%; width: auto; height: auto;
    }
  </style>
</head>
<body>
  <div class="outer">
    <div class="main">
      <div class="bg111">
        <div class="centerer">
          <div class="wrapper">
            <img src="https://fastly.picsum.photos/id/111/4000/2000.jpg?hmac=X" />
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
