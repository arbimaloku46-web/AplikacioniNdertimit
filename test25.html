<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: #333; height: 100vh; }
    
    .screen {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 2rem; box-sizing: border-box; overflow: hidden;
    }
    
    .wrapper { 
      position: relative; 
      /* Try inline-block but with min-h-0 min-w-0 */
      display: flex;
      min-width: 0; min-height: 0; 
      max-width: 100%; max-height: 100%; 
      border: 4px solid blue;
    }
    
    img { 
      display: block; 
      max-width: 100%; max-height: 100%; 
      /* Object-fit contain to prevent stretch? */
      object-fit: contain;
      width: auto; height: auto; 
      min-width: 0; min-height: 0;
      border: 2px solid red;
    }
    
  </style>
</head>
<body>
  <div class="screen">
    <div class="wrapper" id="wrapper">
      <img id="img" src="https://fastly.picsum.photos/id/111/1200/800.jpg?hmac=X" />
    </div>
  </div>
</body>
</html>
