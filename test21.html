<!DOCTYPE html>
<html>
<head>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; background: #333; }
    
    .screen {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      padding: 2rem; box-sizing: border-box; overflow: hidden;
      position: absolute; inset: 0;
    }
    
    .wrapper { 
      position: relative; display: inline-block; 
      max-width: 100%; max-height: 100%; 
      border-radius: 1rem; box-shadow: 0 0 10px rgba(0,0,0,0.5);
      line-height: 0;
      background: yellow; /* highlight wrapper */
    }
    
    img { 
      display: block; 
      max-width: 100%; max-height: 100%; 
      width: auto; height: auto; 
      border-radius: 1rem; 
      opacity: 0.5; /* see wrapper behind it */
    }
    
    svg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Ultra Portrait Image -->
  <div class="screen">
    <div class="wrapper" id="wrapper">
      <img id="img" src="https://fastly.picsum.photos/id/111/400/2000.jpg?hmac=X-oR08B0D7D06vM84f18n598R58Y5C4aB97w53z03W0" />
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">
        <rect x="0" y="0" width="100" height="100" fill="rgba(255,0,0,0.3)" />
      </svg>
    </div>
  </div>
  <script>
    setTimeout(() => {
      const wrapper = document.getElementById('wrapper');
      const img = document.getElementById('img');
      console.log('wrapper:', wrapper.getBoundingClientRect());
      console.log('img:', img.getBoundingClientRect());
    }, 500);
  </script>
</body>
</html>
