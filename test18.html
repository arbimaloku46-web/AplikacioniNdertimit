<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #333; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden;}
    
    .scroll-container {
      width: 100%; height: 100%;
      overflow: auto;
      text-align: center; /* center horizontally */
    }
    
    .scroll-container::before {
      content: ''; display: inline-block; height: 100%; vertical-align: middle;
    }
    
    .wrapper { 
      position: relative; display: inline-block; vertical-align: middle; 
      line-height: 0;
      /* zoom by transform */
      transform: scale(2.0);
      transform-origin: center;
      /* if transform-origin is center, it scales from center. If it gets larger than container, it might bleed into negative margins and not scroll correctly. */
    }
    
    img { 
      display: block; max-width: 80vw; max-height: 80vh; width: auto; height: auto; 
    }
    
    .pt { position: absolute; width: 4px; height: 4px; background: red; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
  </style>
</head>
<body>
  <div class="scroll-container">
    <div class="wrapper" id="wrapper">
      <img id="img" src="https://fastly.picsum.photos/id/111/400/300.jpg?hmac=1" />
    </div>
  </div>
  <script>
    const wrapper = document.getElementById('wrapper');
    const img = document.getElementById('img');
    img.addEventListener('click', (e) => {
      const rect = img.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      const pt = document.createElement('div');
      pt.className = 'pt';
      pt.style.left = x + '%';
      pt.style.top = y + '%';
      wrapper.appendChild(pt);
      console.log('Clicked', x, y);
    });
  </script>
</body>
</html>
