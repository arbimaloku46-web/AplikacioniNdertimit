<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: #333; height: 100vh; }
    
    .screen {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 2rem; box-sizing: border-box; overflow: hidden;
      border: 2px solid yellow;
      min-height: 0; min-width: 0;
    }
    
    .wrapper { 
      position: relative; 
      display: inline-block;
      min-width: 0; min-height: 0; max-width: 100%; max-height: 100%; 
      border: 4px solid blue;
      border-radius: 1rem;
      line-height: 0;
    }
    
    img { 
      display: block; 
      max-width: 100%; max-height: 100%; 
      width: auto; height: auto; 
      min-width: 0; min-height: 0;
      border: 2px solid red;
    }
    
  </style>
</head>
<body>
  <!-- Ultra Portrait -->
  <div class="screen" style="top: 0; height: 50vh;">
    <div class="wrapper" id="wrapper1">
      <img id="img1" src="https://fastly.picsum.photos/id/111/400/2000.jpg?hmac=X" />
    </div>
  </div>
  <!-- Ultra Wide -->
  <div class="screen" style="top: 50vh; height: 50vh;">
    <div class="wrapper" id="wrapper2">
      <img id="img2" src="https://fastly.picsum.photos/id/111/2000/400.jpg?hmac=X" />
    </div>
  </div>
  <script>
    setTimeout(() => {
      console.log('wrapper1:', document.getElementById('wrapper1').getBoundingClientRect());
      console.log('wrapper2:', document.getElementById('wrapper2').getBoundingClientRect());
    }, 500);
  </script>
</body>
</html>
