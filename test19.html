<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #333; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh;}
    
    .wrapper { 
      position: relative; display: inline-block; max-width: 100%; max-height: 100%; 
      border-radius: 1rem; box-shadow: 0 0 10px rgba(0,0,0,0.5);
      line-height: 0;
      /* add border to see wrapper */
      border: 4px solid blue;
    }
    
    img { 
      display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; 
      border-radius: 1rem; 
      /* add border to see img */
      border: 4px solid red;
    }
    
    svg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
      /* add border to see svg */
      border: 4px solid green;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div style="width: 50vw; height: 50vh; background: #222; padding: 2rem; display: flex; align-items: center; justify-content: center;">
    <div class="wrapper" id="wrapper">
      <img id="img" src="https://fastly.picsum.photos/id/111/400/2000.jpg?hmac=X-oR08B0D7D06vM84f18n598R58Y5C4aB97w53z03W0" />
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">
        <rect x="0" y="0" width="100" height="100" fill="rgba(0,255,0,0.3)" />
      </svg>
    </div>
  </div>
  <script>
    setTimeout(() => {
      const wrapper = document.getElementById('wrapper');
      const img = document.getElementById('img');
      const svg = document.querySelector('svg');
      console.log('wrapper:', wrapper.getBoundingClientRect());
      console.log('img:', img.getBoundingClientRect());
      console.log('svg:', svg.getBoundingClientRect());
    }, 500);
  </script>
</body>
</html>
