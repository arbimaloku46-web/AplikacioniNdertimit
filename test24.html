<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: #333; height: 100vh; }
    
    .screen {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 2rem; box-sizing: border-box; overflow: hidden;
      border: 2px solid yellow;
    }
    
    .wrapper { 
      position: relative; 
      display: flex;
      min-width: 0; min-height: 0; max-width: 100%; max-height: 100%; 
      border: 4px solid blue;
      border-radius: 1rem;
    }
    
    img { 
      display: block; 
      max-width: 100%; max-height: 100%; 
      width: auto; height: auto; 
      min-width: 0; min-height: 0;
      border-radius: 1rem;
    }
    
  </style>
</head>
<body>
  <div class="screen">
    <div class="wrapper" id="wrapper">
      <img id="img" src="https://fastly.picsum.photos/id/111/4000/2000.jpg?hmac=X" />
    </div>
  </div>
</body>
</html>
