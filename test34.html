<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: #333; height: 100vh; display: flex; flex-direction: column; }
    
    .c1 { flex: 1; min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; background: #111; overflow: hidden; padding: 2rem; box-sizing: border-box; border: 1px solid green; }
    
    .wrapper { 
      display: flex; /* shrink-wrap */
      min-width: 0; min-height: 0; max-width: 100%; max-height: 100%;
      border: 2px solid yellow;
      border-radius: 1rem;
      position: relative;
    }
    
    img { 
      display: block; 
      min-width: 0; min-height: 0; max-width: 100%; max-height: 100%; 
      width: auto; height: auto;
    }
  </style>
</head>
<body>
  <div class="c1">
    <div class="wrapper">
      <img id="img1" src="https://fastly.picsum.photos/id/111/400/2000.jpg?hmac=X" />
    </div>
  </div>
  <div class="c1">
    <div class="wrapper">
      <img id="img2" src="https://fastly.picsum.photos/id/111/2000/400.jpg?hmac=X" />
    </div>
  </div>
</body>
</html>
