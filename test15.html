<!DOCTYPE html>
<html lang="en">
<head>
<style>
  body, html { margin: 0; height: 100%; background: #333; overflow: hidden; }
  .viewer-container {
    position: absolute; inset: 0; 
    display: flex; align-items: center; justify-content: center; 
    padding: 2rem; box-sizing: border-box; 
    overflow: auto; /* allow scroll */
  }
  
  .image-wrapper {
    position: relative;
    display: inline-flex; 
    max-width: 100%; 
    max-height: 100%;
    transform: scale(2); /* Zoom 2x */
    /* if it's centered with flex, transform origin defaults to center. But it won't scroll correctly because flex centering doesn't push the scroll bounds. */
  }
  
  .img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
  }
</style>
</head>
<body>
  <div style="position: relative; width: 100vw; height: 100vh; background: #222;">
    <div class="viewer-container">
      <div class="image-wrapper">
        <img src="https://fastly.picsum.photos/id/111/400/2000.jpg?hmac=X-oR08B0D7D06vM84f18n598R58Y5C4aB97w53z03W0" class="img" />
      </div>
    </div>
  </div>
</body>
</html>
