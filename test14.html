<!DOCTYPE html>
<html lang="en">
<head>
<style>
  body, html { margin: 0; height: 100%; background: #333; }
  .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 2rem; box-sizing: border-box; }
  
  .wrapper { 
    position: relative; 
    display: inline-block;
    max-width: 100%; 
    max-height: 100%; 
    border: 2px solid green;
  }
  
  .img { 
    display: block; 
    max-width: 100%; 
    max-height: 100%; 
  }
</style>
</head>
<body>
  <!-- Ultra Portrait Image in a Landscape Screen -->
  <div style="position: relative; width: 100vw; height: 50vh; background: #222;">
    <div class="screen">
      <div class="wrapper">
        <img src="https://fastly.picsum.photos/id/111/400/2000.jpg?hmac=X-oR08B0D7D06vM84f18n598R58Y5C4aB97w53z03W0" class="img" />
      </div>
    </div>
  </div>
</body>
<script>
  setTimeout(() => {
    const w = document.querySelector('.wrapper');
    const i = document.querySelector('.img');
    console.log("Wrapper:", w.getBoundingClientRect());
    console.log("Image:", i.getBoundingClientRect());
  }, 1000);
</script>
</html>
