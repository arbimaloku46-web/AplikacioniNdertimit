<!DOCTYPE html>
<html lang="en">
<head>
<style>
  body, html { margin: 0; height: 100%; background: #333; }
  .container { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 20px; box-sizing: border-box; }
  .wrapper { position: relative; display: flex; max-width: 100%; max-height: 100%; border: 2px solid green; }
  .img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
  .svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>
<div class="container">
  <div class="wrapper">
    <img src="https://picsum.photos/400/800" class="img" />
    <svg class="svg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <rect x="0" y="0" width="100" height="100" fill="rgba(255,0,0,0.3)" />
      <circle cx="50" cy="50" r="10" fill="blue" />
    </svg>
  </div>
</div>
</body>
</html>
