<!DOCTYPE html>
<html lang="en">
<head>
<style>
  body, html { margin: 0; height: 100%; background: #333; }
  .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 2rem; box-sizing: border-box; min-height: 0; min-width: 0; }
  
  .wrapper { 
    position: relative; 
    /* The magic to shrink-wrap an image bounded by parent size: inline-flex + min-h-0 min-w-0 */
    display: inline-flex; 
    max-width: 100%; 
    max-height: 100%; 
    border: 2px solid green; 
    min-height: 0;
    min-width: 0;
  }
  
  .img { 
    display: block; 
    max-width: 100%; 
    max-height: 100%; 
    width: auto; 
    height: auto; 
    min-height: 0;
    min-width: 0;
    object-fit: contain; /* Let's test with object-contain */
  }
  
  .svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>
  <div style="position: relative; width: 100vw; height: 50vh; background: #222;">
    <div class="screen">
      <div class="wrapper">
        <img src="https://fastly.picsum.photos/id/111/400/800.jpg?hmac=X-oR08B0D7D06vM84f18n598R58Y5C4aB97w53z03W0" class="img" />
        <svg class="svg" viewBox="0 0 100 100" preserveAspectRatio="none">
          <rect x="0" y="0" width="100" height="100" fill="rgba(255,0,0,0.3)" />
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
