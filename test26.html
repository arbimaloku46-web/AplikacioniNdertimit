<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: #333; height: 100vh; }
    
    .screen {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 2rem; box-sizing: border-box; overflow: hidden;
      border: 2px solid yellow;
    }
    
    .wrapper { 
      position: relative; 
      display: flex;
      min-width: 0; min-height: 0; max-width: 100%; max-height: 100%; 
      border: 4px solid blue;
      border-radius: 1rem;
    }
    
    img { 
      display: block; 
      max-width: 100%; max-height: 100%; 
      width: auto; height: auto; 
      min-width: 0; min-height: 0;
      border: 2px solid red;
    }
    
  </style>
</head>
<body>
  <div class="screen">
    <div class="wrapper" id="wrapper">
      <!-- 400x2000 is portrait, 2000x400 is very wide -->
      <img id="img" src="https://fastly.picsum.photos/id/111/2000/400.jpg?hmac=X" />
    </div>
  </div>
  <script>
    setTimeout(() => {
      const wrapper = document.getElementById('wrapper');
      const img = document.getElementById('img');
      console.log('wrapper:', wrapper.getBoundingClientRect());
      console.log('img:', img.getBoundingClientRect());
    }, 500);
  </script>
</body>
</html>
